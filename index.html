<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
html,
body {
  height: 100%;
  margin: 0;
  padding: 0;
}

#container {
  display: flex;
  flex-wrap: wrap;
  height: 100%;
}

.screen {
  flex: 1 0 50%;
  height: 50%;
  padding: 10px;
  box-sizing: border-box;
  border: 1px solid #000;
}


    </style>
</head>
<body>
    <div id="container"></div>
    <button id="addScreenBtn">Add Screen</button>
</body>
<script>
const container = document.getElementById('container');
const addScreenBtn = document.getElementById('addScreenBtn');
let screenCount = 0;

addScreenBtn.addEventListener('click', addScreen);

function addScreen() {
  screenCount++;
  const screen = document.createElement('div');
  screen.classList.add('screen');
  screen.textContent = `Screen ${screenCount}`;
  container.appendChild(screen);
  adjustScreenSizes();
}

function adjustScreenSizes() {
  const screens = Array.from(container.getElementsByClassName('screen'));
  const numScreens = screens.length;

  screens.forEach(screen => {
    screen.style.flex = `1 0 ${100 / numScreens}%`;
  });
}






</script>
</html>
